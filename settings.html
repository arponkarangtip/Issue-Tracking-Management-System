<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b132b">
  <title>Issue Tracking &amp; Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css?v=17" rel="stylesheet">
</head>
<body>
  <main class="main-scroll-area" id="mainScrollArea">
    <div class="main-inner-container">

<div class="hero-header mb-4"><h1>SLA Rules &amp; Google Sheet Connection</h1><p>Configure priority response deadlines and Apps Script Web App URL</p></div>
<div class="row g-4">
  <div class="col-12 col-lg-6">
    <div class="slab" data-tilt>
      <h2 class="h6 fw-bold text-info mb-3">SLA Deadline Thresholds (Hours)</h2>
      <div class="tablewrap mb-3">
        <table class="table-3d"><thead><tr><th>Priority</th><th>Response (h)</th><th>Resolution (h)</th><th>Escalation (h)</th><th>Save</th></tr></thead><tbody id="slaBody"></tbody></table>
      </div>
    </div>
  </div>
  <div class="col-12 col-lg-6">
    <div class="slab" data-tilt>
      <h2 class="h6 fw-bold text-info mb-3">Google Sheet API Endpoint</h2>
      <label class="small d-block mb-1" style="color:var(--mute);">Apps Script Web App URL</label>
      <input type="url" id="setUrlInp" class="input-3d w-100 py-2 mb-2">
      <div class="d-flex gap-2 flex-wrap">
        <button type="button" id="saveUrlSet" class="btn-3d purple py-2 px-3">Save URL</button>
        <button type="button" id="repairDbSet" class="btn-3d ok py-2 px-3">Verify / Initialize Sheet Tabs</button>
      </div>
    </div>
  </div>
</div>

    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="assets/js/gsheet-api.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/reactive3d.js?v=17"></script>
  <script src="assets/js/app.js?v=17"></script>
  <script>

const user = initStationaryShell("settings.html", "Settings");
document.getElementById("setUrlInp").value = GSheetDB.getUrl();
async function loadSet() {
  const db = await GSheetDB.get({ action: "bundle" });
  renderNotifications(db.notifications, user.id);
  document.getElementById("slaBody").innerHTML = (db.sla_settings || []).map(s => `
    <tr>
      <td class="fw-bold text-info">${e(s.priority)}</td>
      <td><input type="number" id="res_${s.id}" value="${s.response_hours}" class="input-3d py-1 px-2" style="width:70px;"></td>
      <td><input type="number" id="sol_${s.id}" value="${s.resolution_hours}" class="input-3d py-1 px-2" style="width:70px;"></td>
      <td><input type="number" id="esc_${s.id}" value="${s.escalation_hours}" class="input-3d py-1 px-2" style="width:70px;"></td>
      <td><button class="btn-3d py-1 px-2" onclick="saveSla(${s.id})">Save</button></td>
    </tr>
  `).join("");
}
window.saveSla = async id => {
  await GSheetDB.post({ action: "update", sheet: "sla_settings", keyVal: id, data: { response_hours: document.getElementById("res_"+id).value, resolution_hours: document.getElementById("sol_"+id).value, escalation_hours: document.getElementById("esc_"+id).value } });
  window.showToast("SLA updated");
};
document.getElementById("saveUrlSet").addEventListener("click", () => { GSheetDB.setUrl(document.getElementById("setUrlInp").value); window.showToast("Web App URL saved"); });
document.getElementById("repairDbSet").addEventListener("click", async () => { const r = await GSheetDB.get({ action: "setup" }); window.showToast(r.message); });
loadSet();

  </script>
</body>
</html>
