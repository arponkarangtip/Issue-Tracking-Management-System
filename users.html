<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b132b">
  <title>Issue Tracking &amp; Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css?v=17" rel="stylesheet">
</head>
<body>
  <main class="main-scroll-area" id="mainScrollArea">
    <div class="main-inner-container">

<div class="hero-header d-flex justify-content-between align-items-end mb-4 flex-wrap gap-2">
  <div>
    <h1>Manage Interns &amp; Admins</h1>
    <p>Create, edit, reset passwords, and monitor Admin &amp; Intern workload capacity</p>
  </div>
</div>

<div class="row g-4">
  <div class="col-12 col-lg-4">
    <div class="slab" data-tilt>
      <h2 class="h6 fw-bold text-info mb-3"><i class="bi bi-person-plus me-1"></i>Create / Edit Staff Account</h2>
      <form id="staffForm">
        <input type="hidden" id="editStaffId">
        <div class="mb-2">
          <label class="form-label small fw-bold">Staff ID Code *</label>
          <input type="text" id="empCode" class="input-3d w-100 py-2" required placeholder="INT-002">
        </div>
        <div class="mb-2">
          <label class="form-label small fw-bold">Full Name *</label>
          <input type="text" id="fullName" class="input-3d w-100 py-2" required placeholder="Intern Full Name">
        </div>
        <div class="mb-2">
          <label class="form-label small fw-bold">Login Email *</label>
          <input type="email" id="staffEmail" class="input-3d w-100 py-2" required placeholder="intern2@issuetracker.local">
        </div>
        <div class="mb-2">
          <label class="form-label small fw-bold">Mobile Number</label>
          <input type="tel" id="staffMobile" class="input-3d w-100 py-2" placeholder="017XXXXXXXX">
        </div>
        <div class="row g-2 mb-2">
          <div class="col-6">
            <label class="form-label small fw-bold">Role *</label>
            <select id="staffRole" class="input-3d w-100 py-2">
              <option value="intern" selected>Intern</option>
              <option value="admin">Admin</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label small fw-bold">Department</label>
            <select id="staffDept" class="input-3d w-100 py-2"></select>
          </div>
        </div>
        <div class="row g-2 mb-3">
          <div class="col-6">
            <label class="form-label small fw-bold">Status</label>
            <select id="staffStatus" class="input-3d w-100 py-2">
              <option value="active">Active</option>
              <option value="inactive">Inactive</option>
            </select>
          </div>
          <div class="col-6">
            <label class="form-label small fw-bold">Password</label>
            <input type="text" id="staffPass" class="input-3d w-100 py-2" placeholder="Intern@123">
          </div>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn-3d w-100 py-2">Save Account</button>
          <button type="button" id="cancelEditStaff" class="btn-3d alt py-2 d-none">Cancel</button>
        </div>
      </form>
    </div>
  </div>

  <div class="col-12 col-lg-8">
    <div class="slab" data-tilt>
      <h2 class="h6 fw-bold text-info mb-3">Registered Admins &amp; Interns</h2>
      <div class="tablewrap">
        <table class="table-3d">
          <thead><tr><th>Code</th><th>Name</th><th>Email</th><th>Role</th><th>Dept</th><th>Status</th><th>Action</th></tr></thead>
          <tbody id="staffBody"></tbody>
        </table>
      </div>
    </div>
  </div>
</div>

    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="assets/js/gsheet-api.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/reactive3d.js?v=17"></script>
  <script src="assets/js/app.js?v=17"></script>
  <script>

const user = initStationaryShell("users.html", "Manage Staff");
if (user.role !== "admin") window.location.href = "dashboard.html";
let db = null;

async function loadStaff() {
  db = await GSheetDB.get({ action: "bundle" });
  renderNotifications(db.notifications, user.id);
  const deptMap = Object.fromEntries((db.departments || []).map(d => [String(d.id), d.name]));
  document.getElementById("staffDept").innerHTML = '<option value="">-- None --</option>' +
    (db.departments || []).map(d => `<option value="${d.id}">${e(d.name)}</option>`).join("");

  document.getElementById("staffBody").innerHTML = (db.users || []).map(u => `
    <tr>
      <td class="fw-bold text-info">${e(u.employee_code)}</td>
      <td>${e(u.full_name)}</td>
      <td>${e(u.email)}</td>
      <td><span class="tag-pill ${u.role === "admin" ? "tag-purple" : "tag-cyan"} text-uppercase">${e(u.role)}</span></td>
      <td>${e(deptMap[String(u.department_id)] || "-")}</td>
      <td><span class="tag-pill ${u.status === "active" ? "tag-green" : "tag-slate"}">${e(u.status)}</span></td>
      <td><button type="button" class="btn-3d alt py-1 px-2" onclick="editStaff(${u.id})">Edit</button></td>
    </tr>
  `).join("");
}

window.editStaff = function(id) {
  const u = (db.users || []).find(x => String(x.id) === String(id));
  if (!u) return;
  document.getElementById("editStaffId").value = u.id;
  document.getElementById("empCode").value = u.employee_code;
  document.getElementById("fullName").value = u.full_name;
  document.getElementById("staffEmail").value = u.email;
  document.getElementById("staffMobile").value = u.mobile_number || "";
  document.getElementById("staffRole").value = u.role;
  document.getElementById("staffDept").value = u.department_id || "";
  document.getElementById("staffStatus").value = u.status;
  document.getElementById("staffPass").value = "";
  document.getElementById("cancelEditStaff").classList.remove("d-none");
};

document.getElementById("cancelEditStaff").addEventListener("click", () => {
  document.getElementById("editStaffId").value = "";
  document.getElementById("staffForm").reset();
  document.getElementById("cancelEditStaff").classList.add("d-none");
});

document.getElementById("staffForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const id = document.getElementById("editStaffId").value;
  const payload = {
    employee_code: document.getElementById("empCode").value.trim(),
    full_name: document.getElementById("fullName").value.trim(),
    email: document.getElementById("staffEmail").value.trim(),
    mobile_number: document.getElementById("staffMobile").value.trim(),
    role: document.getElementById("staffRole").value,
    department_id: document.getElementById("staffDept").value,
    status: document.getElementById("staffStatus").value
  };
  const pw = document.getElementById("staffPass").value.trim();
  if (pw) payload.password_hash = pw;
  if (!id && !pw) payload.password_hash = "Intern@123";

  if (id) {
    await GSheetDB.post({ action: "update", sheet: "users", keyVal: id, data: payload });
    window.showToast("Account updated");
  } else {
    payload.failed_attempts = 0;
    await GSheetDB.post({ action: "insert", sheet: "users", data: payload });
    window.showToast("New staff account created");
  }
  document.getElementById("cancelEditStaff").click();
  loadStaff();
});

loadStaff();

  </script>
</body>
</html>
