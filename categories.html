<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b132b">
  <title>Issue Tracking &amp; Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css?v=17" rel="stylesheet">
</head>
<body>
  <main class="main-scroll-area" id="mainScrollArea">
    <div class="main-inner-container">

<div class="hero-header mb-4"><h1>Categories &amp; Departments</h1><p>Configure issue taxonomy and organizational units</p></div>
<div class="row g-4">
  <div class="col-12 col-lg-7">
    <div class="slab" data-tilt>
      <h2 class="h6 fw-bold text-info mb-3">Issue Categories</h2>
      <form id="addCatForm" class="row g-2 mb-3">
        <div class="col-12 col-sm-4"><input type="text" id="catName" class="input-3d w-100 py-2" placeholder="Category Name" required></div>
        <div class="col-12 col-sm-5"><input type="text" id="catDesc" class="input-3d w-100 py-2" placeholder="Description"></div>
        <div class="col-12 col-sm-3"><button type="submit" class="btn-3d w-100 py-2">Add</button></div>
      </form>
      <div class="tablewrap"><table class="table-3d"><thead><tr><th>Name</th><th>Description</th><th>Status</th><th>Action</th></tr></thead><tbody id="catBody"></tbody></table></div>
    </div>
  </div>
  <div class="col-12 col-lg-5">
    <div class="slab" data-tilt>
      <h2 class="h6 fw-bold text-info mb-3">Departments</h2>
      <form id="addDeptForm" class="row g-2 mb-3">
        <div class="col-12 col-sm-5"><input type="text" id="deptName" class="input-3d w-100 py-2" placeholder="Department Name" required></div>
        <div class="col-6 col-sm-4"><input type="text" id="deptCode" class="input-3d w-100 py-2" placeholder="Code (HR-01)" required></div>
        <div class="col-6 col-sm-3"><button type="submit" class="btn-3d purple w-100 py-2">Add</button></div>
      </form>
      <div class="tablewrap"><table class="table-3d"><thead><tr><th>Code</th><th>Department</th></tr></thead><tbody id="deptBody"></tbody></table></div>
    </div>
  </div>
</div>

    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="assets/js/gsheet-api.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/reactive3d.js?v=17"></script>
  <script src="assets/js/app.js?v=17"></script>
  <script>

const user = initStationaryShell("categories.html", "Categories & Departments");
async function loadTax() {
  const db = await GSheetDB.get({ action: "bundle" });
  renderNotifications(db.notifications, user.id);
  document.getElementById("catBody").innerHTML = (db.categories || []).map(c => `
    <tr><td class="fw-bold">${e(c.name)}</td><td style="color:var(--mute);">${e(c.description)}</td>
    <td><span class="tag-pill ${String(c.is_active) !== "0" ? "tag-green" : "tag-slate"}">${String(c.is_active) !== "0" ? "Active" : "Disabled"}</span></td>
    <td><button class="btn-3d alt py-1 px-2" onclick="toggleCat(${c.id}, ${String(c.is_active) !== "0" ? 0 : 1})">Toggle</button></td></tr>
  `).join("");
  document.getElementById("deptBody").innerHTML = (db.departments || []).map(d => `<tr><td class="fw-bold text-info">${e(d.code)}</td><td>${e(d.name)}</td></tr>`).join("");
}
window.toggleCat = async (id, next) => { await GSheetDB.post({ action: "update", sheet: "issue_categories", keyVal: id, data: { is_active: next } }); loadTax(); };
document.getElementById("addCatForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  await GSheetDB.post({ action: "insert", sheet: "issue_categories", data: { name: document.getElementById("catName").value, description: document.getElementById("catDesc").value, is_active: 1 } });
  ev.target.reset(); loadTax();
});
document.getElementById("addDeptForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  await GSheetDB.post({ action: "insert", sheet: "departments", data: { name: document.getElementById("deptName").value, code: document.getElementById("deptCode").value } });
  ev.target.reset(); loadTax();
});
loadTax();

  </script>
</body>
</html>
