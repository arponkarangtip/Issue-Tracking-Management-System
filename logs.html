<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b132b">
  <title>Issue Tracking &amp; Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css?v=17" rel="stylesheet">
</head>
<body>
  <main class="main-scroll-area" id="mainScrollArea">
    <div class="main-inner-container">

<div class="hero-header mb-4"><h1>Activity Logs &amp; Backup Guidance</h1><p>Security audit trail stored in Google Sheets</p></div>
<section class="slab" data-tilt>
  <h2 class="h6 fw-bold text-info mb-3">Recent Security &amp; Audit Activity Logs</h2>
  <div class="tablewrap"><table class="table-3d"><thead><tr><th>Timestamp</th><th>User</th><th>Action</th><th>Details</th></tr></thead><tbody id="logsBody"></tbody></table></div>
</section>

    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="assets/js/gsheet-api.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/reactive3d.js?v=17"></script>
  <script src="assets/js/app.js?v=17"></script>
  <script>

const user = initStationaryShell("logs.html", "Activity Logs");
async function loadLogs() {
  const db = await GSheetDB.get({ action: "bundle" });
  renderNotifications(db.notifications, user.id);
  const uMap = Object.fromEntries((db.users || []).map(u => [String(u.id), u.full_name]));
  document.getElementById("logsBody").innerHTML = (db.activity_logs || []).slice(-100).reverse().map(l => `
    <tr><td>${e(String(l.created_at).slice(0,19))}</td><td>${e(uMap[String(l.user_id)] || "Guest/System")}</td><td class="fw-bold text-info">${e(l.action)}</td><td>${e(l.details)}</td></tr>
  `).join("");
}
loadLogs();

  </script>
</body>
</html>
