<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b132b">
  <title>Issue Tracking &amp; Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css?v=17" rel="stylesheet">
</head>
<body>
  <main class="main-scroll-area" id="mainScrollArea">
    <div class="main-inner-container">

<div class="hero-header mb-4"><h1>Knowledge Base &amp; FAQs</h1><p>Standard troubleshooting guides and frequently asked questions</p></div>
<div class="row g-4">
  <div class="col-12 col-lg-7">
    <div class="slab" data-tilt>
      <h2 class="h6 fw-bold text-info mb-3">Publish Knowledge Base Guide</h2>
      <form id="kbForm">
        <div class="row g-2 mb-2">
          <div class="col-12 col-md-7"><input type="text" id="kbTitle" class="input-3d w-100 py-2" placeholder="Article Title" required></div>
          <div class="col-12 col-md-5"><select id="kbCat" class="input-3d w-100 py-2"></select></div>
        </div>
        <textarea id="kbContent" class="input-3d w-100 mb-2" rows="2" placeholder="Resolution steps or policy guidance..." required></textarea>
        <button type="submit" class="btn-3d py-2 px-3">Publish Article</button>
      </form>
    </div>
    <div id="kbArticles"></div>
  </div>
  <div class="col-12 col-lg-5">
    <div class="slab" data-tilt><h2 class="h6 fw-bold text-info mb-3">Frequently Asked Questions</h2><div id="faqList" class="d-flex flex-column gap-3"></div></div>
  </div>
</div>

    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="assets/js/gsheet-api.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/reactive3d.js?v=17"></script>
  <script src="assets/js/app.js?v=17"></script>
  <script>

const user = initStationaryShell("knowledge_base.html", "Knowledge Base & FAQ");
async function loadKb() {
  const db = await GSheetDB.get({ action: "bundle" });
  renderNotifications(db.notifications, user.id);
  const catMap = Object.fromEntries((db.categories || []).map(c => [String(c.id), c.name]));
  document.getElementById("kbCat").innerHTML = '<option value="0">General</option>' + (db.categories || []).map(c => `<option value="${c.id}">${e(c.name)}</option>`).join("");
  document.getElementById("kbArticles").innerHTML = (db.knowledge_base || []).reverse().map(a => `
    <div class="slab" data-tilt><span class="tag-pill tag-cyan mb-2">${e(catMap[String(a.category_id)] || "General")}</span><h6 class="fw-bold">${e(a.title)}</h6><p class="small mb-0" style="color:var(--mute);white-space:pre-line;">${e(a.content)}</p></div>
  `).join("");
  document.getElementById("faqList").innerHTML = (db.faqs || []).map(f => `
    <div class="p-3 rounded" style="background:var(--indigo-50);border:1px solid var(--edge);"><div class="fw-bold small text-info mb-1">${e(f.question)}</div><div class="small" style="color:var(--mute);">${e(f.answer)}</div></div>
  `).join("");
}
document.getElementById("kbForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  await GSheetDB.post({ action: "insert", sheet: "knowledge_base", data: { category_id: document.getElementById("kbCat").value, title: document.getElementById("kbTitle").value, content: document.getElementById("kbContent").value } });
  ev.target.reset(); loadKb();
});
loadKb();

  </script>
</body>
</html>
