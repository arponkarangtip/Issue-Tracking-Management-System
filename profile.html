<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b132b">
  <title>Issue Tracking &amp; Management System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="assets/css/style.css?v=17" rel="stylesheet">
</head>
<body>
  <main class="main-scroll-area" id="mainScrollArea">
    <div class="main-inner-container">

<div class="hero-header mb-4"><h1>Staff Profile &amp; Security</h1><p>Update your permitted account information and password</p></div>
<div class="row justify-content-center"><div class="col-12 col-sm-10 col-md-7 col-lg-5"><div class="slab" data-tilt>
  <form id="profForm">
    <div class="mb-2"><label class="small d-block mb-1" style="color:var(--mute);">Staff ID Code</label><input type="text" id="prCode" class="input-3d w-100 py-2" readonly></div>
    <div class="mb-2"><label class="small d-block mb-1" style="color:var(--mute);">Email (Read-Only)</label><input type="text" id="prEmail" class="input-3d w-100 py-2" readonly></div>
    <div class="mb-2"><label class="form-label small fw-bold text-info">Full Name</label><input type="text" id="prName" class="input-3d w-100 py-2" required></div>
    <div class="mb-2"><label class="form-label small fw-bold text-info">Mobile Number</label><input type="tel" id="prMobile" class="input-3d w-100 py-2"></div>
    <div class="mb-3"><label class="form-label small fw-bold text-info">New Password (leave blank to keep current)</label>
      <div class="password-field-wrap"><input type="password" id="profileNewPass" class="input-3d w-100 py-2 pe-5" minlength="6"><button type="button" class="password-toggle-btn" id="toggleProfilePass"><i class="bi bi-eye-fill" id="toggleProfilePassIcon"></i></button></div>
    </div>
    <button type="submit" class="btn-3d w-100">Update Profile</button>
  </form>
</div></div></div>

    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
  <script src="assets/js/gsheet-api.js"></script>
  <script src="assets/js/shell.js"></script>
  <script src="assets/js/reactive3d.js?v=17"></script>
  <script src="assets/js/app.js?v=17"></script>
  <script>

const user = initStationaryShell("profile.html", "My Profile");
document.getElementById("prCode").value = user.employee_code;
document.getElementById("prEmail").value = user.email;
document.getElementById("prName").value = user.full_name;
document.getElementById("prMobile").value = user.mobile_number || "";
document.getElementById("toggleProfilePass").addEventListener("click", () => {
  const inp = document.getElementById("profileNewPass");
  const isH = inp.type === "password";
  inp.type = isH ? "text" : "password";
  document.getElementById("toggleProfilePassIcon").className = isH ? "bi bi-eye-slash-fill" : "bi bi-eye-fill";
});
document.getElementById("profForm").addEventListener("submit", async ev => {
  ev.preventDefault();
  const upd = { full_name: document.getElementById("prName").value.trim(), mobile_number: document.getElementById("prMobile").value.trim() };
  const pw = document.getElementById("profileNewPass").value;
  if (pw) upd.password_hash = pw;
  await GSheetDB.post({ action: "update", sheet: "users", keyVal: user.id, data: upd });
  Object.assign(user, upd); delete user.password_hash;
  localStorage.setItem("itp_user", JSON.stringify(user));
  window.showToast("Profile updated");
});

  </script>
</body>
</html>
